<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frost Legion Demonlist - Player Stats</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {--bg:#ffffff;--panel:#ffffff;--card:#ffffff;--text:#0b0b0b;--muted:#5a6470;--accent:#2b5bd6;--border:#e6e9ee;}
    *{box-sizing:border-box;}
    html, body{min-height:100%;height:100%;margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);background-color:var(--bg);color:var(--text);} 
    body, button, input, textarea, select, a{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
    .layout{display:grid;grid-template-columns:1fr;gap:1rem;max-width:1100px;margin:2rem auto;padding:0 1rem;}
    .sidebar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1rem;position:sticky;top:1.25rem;align-self:start;box-shadow:0 6px 18px rgba(15,23,42,0.06);}
    .sidebar h2{margin:.2rem 0 .6rem;color:var(--text);letter-spacing:.3px;}
    .sidebar ul{list-style:none;margin:0;padding:0;}
    .sidebar li{margin:.4rem 0;}
    .sidebar a{color:var(--text);text-decoration:none;padding:.4rem .6rem;display:block;border-radius:.5rem;}
    .sidebar a:hover{background:#f1f5ff;}
    .sub{margin-left:.7rem;}
    .toggle{width:100%;background:none;border:none;color:var(--text);text-align:left;padding:.45rem .35rem;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:space-between;border-radius:.35rem;}
    .toggle:hover{background:#f1f5ff;}
    .hidden{display:none;}
    .content{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.5rem;box-shadow:0 10px 30px rgba(2,6,23,0.06);}
    .hero{border-radius:12px;border:1px solid var(--border);background:linear-gradient(180deg,#ffffff,#fafbfd);padding:1.2rem;}
    .hero h1{margin:.1rem 0 .25rem;color:var(--text);font-size:1.8rem}
    .hero p{margin:0;color:var(--muted);line-height:1.45}
    .cardholder{margin-top:1rem;display:grid;grid-template-columns:1fr;gap:1rem;}
    .demon-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem;display:grid;grid-template-columns:150px 1fr;gap:1rem;}
    .thumb{border:1px dashed #e6eaf8;border-radius:10px;background:#fff;min-height:120px;display:flex;align-items:center;justify-content:center;color:#5f6d86;font-size:.9rem}
    .info{display:flex;flex-direction:column;gap:.35rem;color:var(--text);}
    .by{font-weight:700;color:var(--text);letter-spacing:.2px;}
    .meta{font-size:.95rem;color:var(--muted);margin:.1rem 0;}
    .form-section{margin-top:1rem;border:1px solid var(--border);border-radius:12px;padding:1rem;background:var(--panel);}
    .stat-list{display:grid;gap:.85rem;margin-top:1.5rem;}
    .stat-line{padding:.95rem 1rem;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-weight:600;}
    .form-row{display:grid;grid-template-columns:1fr 180px;gap:.6rem;align-items:center;margin:.5rem 0;}
    .form-row label{font-size:.95rem;color:var(--muted);}
    .form-row input{width:100%;padding:.5rem .65rem;border-radius:.6rem;border:1px solid #d7dbe6;background:#fff;color:var(--text);}
    .add-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:.6rem;padding:.55rem .9rem;cursor:pointer;margin-top:.55rem;}
    .footer{margin-top:1.25rem;padding:.9rem 0;font-size:.9rem;color:var(--muted);border-top:1px solid var(--border);}
    .discord-icon{width:24px;height:24px;vertical-align:middle;display:inline-block;}
    body.dark-theme .discord-icon{content:url(/icons/darkmode%20discord.png);} 
    .dark-toggle{margin-left:auto;background:none;border:1px solid var(--border);padding:.35rem .6rem;border-radius:.45rem;cursor:pointer;color:var(--text);}
    .dark-toggle:hover{background:#f6f8ff}
    .list-links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
    .list-links a{background:var(--card);color:var(--text);padding:.65rem 1rem;border-radius:.6rem;text-decoration:none;border:1px solid var(--border);box-shadow:0 6px 18px rgba(16,24,40,0.04);} 
    .list-links a:hover{transform:translateY(-1px)}

    /* Dark theme overrides (true black) */
    html.dark-theme, body.dark-theme{background:#000;color:#fff;}
    body.dark-theme{ --panel:#0b0b0b; --card:#0b0b0b; --text:#fff; --muted:#9ea6af; --accent:#1d4ed8; --border:rgba(255,255,255,.06);} 
    body.dark-theme{background:#000;color:#fff; /* theme variables for components */
      --panel:#0b0b0b; --card:#0b0b0b; --text:#fff; --muted:#9ea6af; --accent:#1d4ed8; --border:rgba(255,255,255,.06);
    }
    /* Force text colors to follow theme even when elements use hardcoded colors */
    body.dark-theme *{color:#fff !important}
    body.dark-theme .content{background:#0b0b0b;border-color:#111;box-shadow:none}
    body.dark-theme .hero{background:#0d0d0d;border-color:rgba(255,255,255,.06)}
    body.dark-theme .sidebar{background:#070707;border-color:rgba(255,255,255,.06)}
    body.dark-theme .sidebar a{color:#e6e6e6}
    body.dark-theme .list-links a{background:#111;color:#fff}
    body.dark-theme .footer{color:#ddd;border-top-color:rgba(255,255,255,.06)}
    body.dark-theme .topbar{background:#000;border-bottom:1px solid rgba(255,255,255,.06)}
    body.dark-theme .hamburger, body.dark-theme .topbar-title, body.dark-theme .dark-toggle{color:#fff}
    body.dark-theme .dark-toggle{border-color:rgba(255,255,255,.06)}
    .topbar{position:sticky;top:0;z-index:400;background:var(--panel);padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;border-bottom:1px solid var(--border);} 
    .hamburger{font-size:1.1rem;background:none;border:1px solid var(--border);border-radius:.3rem;color:var(--text);padding:.25rem .5rem;cursor:pointer;} 
    .topbar-title{font-weight:700;color:var(--text);} 
    .left-menu{position:fixed;left:.4rem;top:3.6rem;background:var(--panel);border:1px solid var(--border);border-radius:.5rem;padding:.45rem .5rem;display:none;z-index:450;min-width:190px;box-shadow:0 8px 24px rgba(16,24,40,0.08);}
    .left-menu.show{display:block;}
    .left-menu a{display:block;color:var(--text);text-decoration:none;padding:.25rem 0;border-radius:.2rem;}
    .left-menu a:hover{background:rgba(0,0,0,0.04);}
    .left-menu .menu-section{margin:.35rem 0 .15rem;color:var(--muted);font-size:.8rem;letter-spacing:.3px;}
    body.dark-theme .left-menu{background:#070707;border-color:rgba(255,255,255,.06);box-shadow:none}
    body.dark-theme .left-menu a{color:#fff}
    body.dark-theme .left-menu a:hover{background:rgba(255,255,255,0.03)}
    body.dark-theme .left-menu .menu-section{color:#cfcfcf}
    /* Stat box + progress bar styles */
    .stat-container{display:flex;flex-direction:column;gap:8px;margin-top:20px;margin-bottom:20px;width:100%}
    .stat-box{background:var(--card);color:var(--text);border-radius:8px;padding:12px 16px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:8px}
    .stat-title{font-size:1rem}
    .progress-track{height:10px;background:var(--border);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:rgba(0,0,0,0.12);width:0%;transition:width .6s ease}
    body.dark-theme .stat-box{background:var(--card);color:#fff;box-shadow:none}
    body.dark-theme .progress-track{background:rgba(255,255,255,0.04)}
    body.dark-theme .progress-fill{background:rgba(255,255,255,0.12)}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:0;}.sidebar{display:none;}}
  </style>
</head>
<body>
<div class="topbar"><button id="menuBtn" class="hamburger">☰</button><div class="topbar-title">Frost Legion Demonlist</div><button id="darkToggle" class="dark-toggle" aria-pressed="false">🌙</button></div>
<div id="leftMenu" class="left-menu hidden">
  <a href="https://ilovecats2435.github.io/">Home</a>
  <div class="menu-section">Lists</div>
  <a href="/MainList/">Main List</a>
  <a href="/ExtendedList/">Extended List</a>
  <a href="/ImpossibleList/">Impossible List</a>
  <a href="/PlatformerList/">Platformer list</a>
  <div class="menu-section">More</div>
  <a href="/PlayerStats/">Player Stats</a>
  <a href="/Submit/">Submit</a>
</div>

<div class="layout">
<main class="content">
      <div class="hero"><h1>Player Stats</h1><p>View your player stats and progress across Frost Legion lists.</p></div>
      <div class="stat-list">
        <div class="stat-line">1. Ilikegrapes: 125 points</div>
        <div class="stat-line">2. Ilovecats2435: 100 points</div>
      </div>
      <div class="footer"><a href="https://discord.gg/EPWgy5SRfm" target="_blank" rel="noreferrer"><img class="discord-icon" src="/icons/lightmode%20discord.png" alt="Discord invite" /></a></div>
    </main>
  </div>
  <script>
  const menuBtn=document.getElementById('menuBtn');
  const leftMenu=document.getElementById('leftMenu');
  if(menuBtn){menuBtn.addEventListener('click',()=>{leftMenu?.classList.toggle('show');});}
  const toggles=document.querySelectorAll('.toggle');
  toggles.forEach(btn=>{btn.addEventListener('click',()=>{const show=document.getElementById(btn.dataset.target); if(!show) return; const hidden=show.classList.toggle('hidden'); btn.textContent=(hidden?'▸':'▾')+' '+btn.textContent.slice(2);});});

  // Dark mode toggle: persist preference and apply theme (true black)
  const darkToggle = document.getElementById('darkToggle');
  const bodyEl = document.body;
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.classList.add('dark-theme');
      bodyEl.classList.add('dark-theme');
      darkToggle.textContent = '☀️';
      darkToggle.setAttribute('aria-pressed','true');
    } else {
      document.documentElement.classList.remove('dark-theme');
      bodyEl.classList.remove('dark-theme');
      darkToggle.textContent = '🌙';
      darkToggle.setAttribute('aria-pressed','false');
    }
  }
  const saved = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(saved);
  if(darkToggle){darkToggle.addEventListener('click',()=>{const next = bodyEl.classList.contains('dark-theme') ? 'light' : 'dark'; applyTheme(next); localStorage.setItem('theme', next);});}
  </script>
